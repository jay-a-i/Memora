[project]
name = "memora"
version = "0.1.0"
description = "Agentic RAG"
readme = "backend/README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    "httpx",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "psycopg[binary]",
    "greenlet>=3.5.5",
    "pgvector>=0.5.0",
    # Agent + LLM
    "langchain-core",
    "langchain-openai",
    "langchain-community",
    "langchain-text-splitters",
    "langgraph",
    "langchain-tavily>=0.2.18",
    "tavily>=1.1.0",
    # Document parsing
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "pypdf",
    "python-docx>=1.2.0",
    "pytest>=9.1.1",
    "langchain-cohere>=0.6.0",
    "cohere>=5.21.1",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
